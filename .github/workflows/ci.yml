name: SentinelShield CI/CD & Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-syntax:
    name: Code Quality, AST & Lint Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Linting & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sentinelshield/requirements.txt

      - name: Run AST Syntax Compilation & Anti-Pattern Linter
        run: |
          python sentinelshield/tests/test_code_quality_and_lints.py

      - name: Run Pylint Code Quality Audit
        run: |
          python -m pylint sentinelshield/modules/ sentinelshield/core/ sentinelshield/app.py --rcfile=.pylintrc

  verify-and-test:
    name: Multi-Tier Verification Suite (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: lint-and-syntax
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sentinelshield/requirements.txt

      - name: Execute Full Verification Suite
        run: |
          python verify.py

      - name: Execute High-Density 200-Stream Stress Benchmark
        run: |
          python sentinelshield/tests/benchmark_200_streams.py
