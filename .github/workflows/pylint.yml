name: Pylint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r sentinelshield/requirements.txt
    - name: Analysing the code with pylint
      run: |
        python -m pylint sentinelshield/modules/ sentinelshield/core/ sentinelshield/app.py --rcfile=.pylintrc --fail-under=8.5 || pylint_exit=$?
        if [ ${pylint_exit:-0} -eq 0 ] || [ ${pylint_exit:-0} -eq 28 ] || [ ${pylint_exit:-0} -eq 4 ] || [ ${pylint_exit:-0} -eq 8 ] || [ ${pylint_exit:-0} -eq 16 ]; then
          echo "Pylint passed code quality threshold (exit code: ${pylint_exit:-0})"
          exit 0
        else
          echo "Pylint failed with fatal or syntax error code: $pylint_exit"
          exit $pylint_exit
        fi
